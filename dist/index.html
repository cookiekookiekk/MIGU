<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171918" />
    <meta name="description" content="《夏日旅行》电子翻页小册子" />
    <title>夏日旅行 · 电子翻页书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">跳到阅读区域</a>

    <div class="reader-menu">
      <button class="icon-button directory-button" id="thumbButton" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="thumbnailPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
    </div>

    <main id="reader" class="reader" tabindex="-1">
      <h1 class="sr-only">夏日旅行</h1>
      <p id="readerHelp" class="sr-only">点击右页向后翻，点击左页向前翻；也可以使用左右方向键、触屏滑动，或打开右上角目录。</p>
      <section class="book-stage" aria-describedby="readerHelp" aria-label="电子书阅读器">
        <div class="book-wrap" id="bookWrap">
          <div class="book" id="book" aria-live="polite"></div>
          <div class="loading-card" id="loadingCard" role="status">
            <span class="loading-line"></span>
            <span>正在装帧页面…</span>
          </div>
        </div>
      </section>
    </main>

    <aside class="thumbnail-panel" id="thumbnailPanel" role="dialog" aria-modal="true" aria-label="页面缩略图" aria-hidden="true" inert>
      <div class="panel-heading">
        <div>
          <span class="eyebrow">CONTENTS</span>
          <h2>目录</h2>
        </div>
        <button class="icon-button icon-button--light" id="closeThumbButton" type="button" aria-label="关闭页面缩略图">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="thumbnail-grid" id="thumbnailGrid"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
